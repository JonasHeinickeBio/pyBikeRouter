[project]
name = "bike-routing-agent"
version = "0.1.0"
description = "OSM-based bike routing service with a LangGraph orchestration workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
# PostgreSQL/PostGIS persistence (issue #7): route history + artifact storage.
db = ["psycopg[binary,pool]>=3.2"]
# S3-compatible artifact storage (issue #27): AWS S3, MinIO, ...
s3 = ["boto3>=1.34"]
# Shared cache backend for multi-instance deployments (issue #29).
cache = ["redis>=5"]
# Free-text request parsing with an LLM (issue #30).
llm = ["anthropic>=1.0"]

[project.scripts]
bike-router = "bike_routing_agent.cli:main"

[tool.poetry]
packages = [{ include = "bike_routing_agent", from = "src" }]
include = [
    { path = "src/bike_routing_agent/frontend/**/*", format = ["sdist", "wheel"] },
    # The schema migrations ship as package data (issue #28).
    { path = "src/bike_routing_agent/storage/migrations/*.sql", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
respx = ">=0.21"
fakeredis = ">=2.23"
ruff = ">=0.6"
mypy = ">=1.11"
pytest-cov = "^7.1.0"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real external service; excluded from the default run",
]
addopts = "-m 'not live' --cov=bike_routing_agent --cov-report=term --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# boto3/botocore ship no type information; the S3 store is the only user.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Anthropic SDK is the optional `llm` extra; CI's typecheck job does not install it.
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
