[project]
name = "bike-routing-agent"
version = "0.1.0"
description = "OSM-based bike routing service with a LangGraph orchestration workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.scripts]
bike-router = "bike_routing_agent.cli:main"

[tool.poetry]
packages = [{ include = "bike_routing_agent", from = "src" }]
include = [{ path = "src/bike_routing_agent/frontend/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=0.23"
respx = ">=0.21"
ruff = ">=0.6"
mypy = ">=1.11"
pytest-cov = "^7.1.0"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real external service; excluded from the default run",
]
addopts = "-m 'not live' --cov=bike_routing_agent --cov-report=term --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
