name: pybikerouter

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pybikerouter-api:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      EXPORT_DIR: /app/exports
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    volumes:
      - exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Optional self-hosted OpenRouteService stack (use with the `self-hosted`
  # profile and GEOCODER_PROVIDER=pelias in .env):
  #
  #   docker compose --profile self-hosted up
  #
  # The public api.openrouteservice.org does NOT serve geocoding; the Pelias
  # geocoder only works against a container like the one below.
  # ---------------------------------------------------------------------------
  ors-self-hosted:
    profiles: ["self-hosted"]
    image: openrouteservice/openrouteservice:latest
    restart: unless-stopped
    ports:
      - "${ORS_LOCAL_PORT:-8080}:8080"
    volumes:
      - ors-graphs:/usr/src/openroute-service/ors-graph
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Local BRouter RouteServer (use with the `brouter` profile and
  # ROUTING_PROVIDER=brouter in .env):
  #
  #   docker compose --profile brouter up
  #
  # Needs at least one .rd5 segment file in ./brouter/segments (download from
  # https://brouter.de/brouter/segments4/, see docker/brouter/README.md). The
  # versioned custom profiles in ./brouter/profiles are mounted as
  # /customprofiles, so "profile=custom_gravel-v1" resolves to
  # gravel-v1.brf here in the repository.
  # ---------------------------------------------------------------------------
  brouter:
    profiles: ["brouter"]
    image: ghcr.io/abrensch/brouter:latest
    restart: unless-stopped
    ports:
      - "${BROUTER_LOCAL_PORT:-17777}:17777"
    environment:
      JAVA_OPTS: "-Xmx1536m"
    volumes:
      - ./brouter/segments:/segments4
      - ./brouter/profiles:/customprofiles:ro
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *default-logging

volumes:
  exports:
    name: pybikerouter-exports
  ors-graphs:
    name: pybikerouter-ors-graphs
