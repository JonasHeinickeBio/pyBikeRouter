name: pybikerouter

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pybikerouter-api:latest
    restart: unless-stopped
    ports:
      # APP_BIND=127.0.0.1 keeps the app off the LAN (use with tailscale, docs/mobile.md).
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      EXPORT_DIR: /app/exports
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    volumes:
      - exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Self-hosted routing + geocoding (`self-hosted` profile): one regional OSM
  # extract feeds a local openrouteservice (bicycle profiles only) and a local
  # Nominatim, so no public API (and no public rate limit) is involved.
  #
  #   scripts/self-hosted-bootstrap.sh          # download extract, start, wait
  #   docker compose -f docker/compose.yaml --profile self-hosted up -d
  #
  # Both services read ./self-hosted/data/region.osm.pbf (docs/self-hosted.md
  # has region choice, hardware requirements and the matching .env).
  # openrouteservice does NOT include a geocoder -- that is why Nominatim runs
  # next to it.
  #
  # Small machine? Run only one of them -- the other keeps using its public
  # service. Each has its own profile as well as the shared `self-hosted` one:
  #   --profile self-hosted-routing     openrouteservice only
  #   --profile self-hosted-geocoding   Nominatim only
  # and size the containers down with ORS_XMX / ORS_MEM_LIMIT /
  # NOMINATIM_THREADS / NOMINATIM_MEM_LIMIT (docs/self-hosted.md, "Requirements").
  # ---------------------------------------------------------------------------
  ors-self-hosted:
    profiles: ["self-hosted", "self-hosted-routing"]
    # Pinned release (upstream publishes versioned tags). To update: bump the
    # tag, delete the pybikerouter-ors-graphs volume (graphs are version
    # specific) and let the graphs rebuild.
    image: openrouteservice/openrouteservice:v10.0.1
    restart: unless-stopped
    ports:
      # No authentication in front of it -- bind loopback only.
      - "127.0.0.1:${ORS_LOCAL_PORT:-8080}:8082"
    environment:
      ors.engine.profile_default.build.source_file: /home/ors/files/region.osm.pbf
      # Only the bicycle profiles the planner maps bike types onto
      # (config.ORS_PROFILE_MAP); everything else would just cost graph build
      # time and memory.
      ors.engine.profiles.driving-car.enabled: "false"
      ors.engine.profiles.cycling-regular.enabled: "true"
      ors.engine.profiles.cycling-road.enabled: "true"
      ors.engine.profiles.cycling-mountain.enabled: "true"
      ors.engine.profiles.cycling-electric.enabled: "true"
      # Java heap. The default maximum suits a federal-state-sized extract; a
      # city-sized one needs far less (docs/self-hosted.md, "Requirements").
      # The initial heap must not exceed the maximum (the JVM refuses to
      # start), so it defaults low and the heap grows as needed.
      XMS: ${ORS_XMS:-128m}
      XMX: ${ORS_XMX:-4g}
    volumes:
      - ./self-hosted/data:/home/ors/files:ro
      - ors-graphs:/home/ors/graphs
      - ors-elevation:/home/ors/elevation_cache
    healthcheck:
      # The ORS image ships wget, not curl.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/ors/v2/health | grep -q ready"]
      interval: 15s
      timeout: 5s
      # Graph building happens before the service answers; allow a long first start.
      start_period: 300s
      retries: 40
    deploy:
      resources:
        limits:
          memory: ${ORS_MEM_LIMIT:-6g}
    logging: *default-logging

  nominatim-self-hosted:
    profiles: ["self-hosted", "self-hosted-geocoding"]
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOMINATIM_LOCAL_PORT:-8081}:8080"
    # PostgreSQL inside the image needs more shared memory than Docker's 64 MB.
    shm_size: 1gb
    environment:
      # Mounted outside /nominatim: the image's init does `chown -R /nominatim`,
      # which fails (and aborts the import) on a read-only mount.
      PBF_PATH: /pbf/region.osm.pbf
      THREADS: ${NOMINATIM_THREADS:-4}
      # "true" makes the image fetch the Wikipedia importance ranking (bigger
      # download, slower import) so result confidence resembles the public
      # Nominatim. Off by default; see docs/self-hosted.md ("Geocoder
      # confidence"). Provided by the image, not exercised in this repo.
      IMPORT_WIKIPEDIA: ${NOMINATIM_IMPORT_WIKIPEDIA:-}
      # Internal to this container (the database port is not published).
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:-nominatim}
    volumes:
      - ./self-hosted/data:/pbf:ro
      - nominatim-data:/var/lib/postgresql/16/main
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status | grep -q OK"]
      interval: 15s
      timeout: 5s
      # The first start imports the extract before serving.
      start_period: 300s
      retries: 40
    deploy:
      resources:
        limits:
          memory: ${NOMINATIM_MEM_LIMIT:-4g}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Shared cache for geocode / Overpass results (`cache` profile), so several
  # API instances reuse each other's lookups (CACHE_BACKEND=redis,
  # CACHE_REDIS_URL=redis://127.0.0.1:6379/0; needs the `cache` extra):
  #
  #   docker compose -f docker/compose.yaml --profile cache up -d redis
  #
  # It is only a cache: no persistence, capped memory with LRU eviction, and the
  # API keeps working (uncached) if it is down. Loopback only, no password --
  # development / single-host use; put real auth in front of a shared one.
  # ---------------------------------------------------------------------------
  redis:
    profiles: ["cache"]
    # Pinned by digest (validated 2026-10-07).
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-128mb}", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_LOCAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Local S3-compatible object store for development (`s3` profile), to try
  # ARTIFACT_BACKEND=s3 and `bike-router retention prune` without AWS:
  #
  #   docker compose -f docker/compose.yaml --profile s3 up -d s3-dev
  #   curl -X PUT http://127.0.0.1:8333/exports          # create the bucket
  #   ARTIFACT_BACKEND=s3 S3_BUCKET=exports S3_ENDPOINT_URL=http://127.0.0.1:8333 \
  #     S3_PATH_STYLE=true AWS_ACCESS_KEY_ID=dev AWS_SECRET_ACCESS_KEY=dev ...
  #
  # SeaweedFS rather than MinIO: MinIO withdrew its community container images
  # (Docker Hub, Sept 2026) and archived the repository. This instance has NO
  # authentication (any credentials work) -- development only, loopback only.
  # ---------------------------------------------------------------------------
  s3-dev:
    profiles: ["s3"]
    # Pinned by digest: the upstream `latest` tag is mutable (validated 2026-10-05).
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # S3 gateway + master/volume in one process; bind all interfaces so the
    # in-container healthcheck (and the published port) reach it.
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${S3_LOCAL_PORT:-8333}:8333"
    volumes:
      - s3-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ && wget -qO- http://127.0.0.1:9333/cluster/status | grep -q IsLeader"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Local BRouter RouteServer (use with the `brouter` profile and
  # ROUTING_PROVIDER=brouter in .env), from the repository root:
  #
  #   docker compose -f docker/compose.yaml --profile brouter up
  #
  # Needs at least one .rd5 segment file in ./brouter/segments (download from
  # https://brouter.de/brouter/segments4/, see docker/brouter/README.md). The
  # versioned custom profiles in ./brouter/profiles are mounted as
  # /customprofiles, so "profile=custom_gravel-v2" resolves to
  # gravel-v2.brf here in the repository.
  # ---------------------------------------------------------------------------
  brouter:
    profiles: ["brouter"]
    # Pinned by digest: upstream publishes only a mutable `latest` tag, so
    # reference the exact image this repo was validated against (2026-09-18).
    # To update: pull :latest, re-run the BRouter live tests, swap the digest.
    image: ghcr.io/abrensch/brouter@sha256:3c6c8a616f054f9237c900760add5fec6b88fc17108348fb2733a1dd62444165
    restart: unless-stopped
    ports:
      # BRouter has no authentication -- bind loopback only.
      - "127.0.0.1:${BROUTER_LOCAL_PORT:-17777}:17777"
    environment:
      JAVA_OPTS: "-Xmx1536m"
    volumes:
      - ./brouter/segments:/segments4
      - ./brouter/profiles:/customprofiles:ro
      # Pinned lookups.dat (version 11, from abrensch/brouter misc/profiles2)
      # -- the copy baked into the image must match the .rd5 segment format
      # version, and upstream images lag behind the segments.
      - ./brouter/lookups.dat:/profiles2/lookups.dat:ro
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Local Valhalla routing service (use with the `valhalla` profile and
  # ROUTING_PROVIDER=valhalla (or "all") in .env), from the repository root:
  #
  #   docker compose -f docker/compose.yaml --profile valhalla up
  #
  # Needs a pre-built tile archive at ./valhalla/valhalla_tiles.tar (unzipped
  # .tar, the scripted entrypoint's default tileset name; build it with
  # valhalla_build_tiles from an OSM extract, or download a pre-built extract
  # from https://github.com/valhalla/valhalla-discourse/wiki/Prebuilt-tiles
  # and decompress). Memory scales with the extract size; a city extract runs
  # fine in ~4g, national extracts need substantially more.
  # ---------------------------------------------------------------------------
  valhalla:
    profiles: ["valhalla"]
    # The scripted image wraps the entrypoint scripts that build
    # valhalla.json and start valhalla_service; plain `valhalla/valhalla` is
    # a build/tooling image and does not serve tiles. Pinned release tag
    # (upstream `latest` is mutable). To update: bump the tag and re-check
    # `curl localhost:8002/status` after `--profile valhalla up`.
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    restart: unless-stopped
    ports:
      # Valhalla has no authentication -- bind loopback only.
      - "127.0.0.1:${VALHALLA_LOCAL_PORT:-8002}:8002"
    environment:
      # Serve the pre-built tile tar instead of building from OSM PBFs.
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      # Tile-only startup: admins/timezone/elevation builds need extra input
      # files (or downloads) that this offline setup does not provide, and
      # bicycle costing without date_time does not use them.
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
    volumes:
      # The scripted entrypoint's tile directory: it reads
      # /custom_files/valhalla_tiles.tar and writes valhalla.json +
      # file_hashes.txt back, so the mount must be writable.
      - ./valhalla:/custom_files
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS for the route history and (optionally) shared
  # artifact storage (issue #7). Use with the `postgis` profile and, in .env:
  #
  #   DATABASE_URL=postgresql://bikerouter:bikerouter@postgis:5432/bikerouter
  #   ARTIFACT_BACKEND=database   # optional: exports live in the database too
  #
  #   docker compose -f docker/compose.yaml --profile postgis up
  #
  # The API creates its tables on first use. Change the demo credentials for
  # anything beyond local development; the port is bound to loopback only.
  # ---------------------------------------------------------------------------
  postgis:
    profiles: ["postgis"]
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGIS_LOCAL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: bikerouter
      POSTGRES_PASSWORD: bikerouter
      POSTGRES_DB: bikerouter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikerouter -d bikerouter"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  exports:
    name: pybikerouter-exports
  pgdata:
    name: pybikerouter-pgdata
  ors-graphs:
    name: pybikerouter-ors-graphs
  ors-elevation:
    name: pybikerouter-ors-elevation
  nominatim-data:
    name: pybikerouter-nominatim-data
  s3-dev-data:
    name: pybikerouter-s3-dev-data
