name: Set up Python and Poetry
description: Python, Poetry (pinned), a lock-file-keyed virtualenv cache, and the project installed with the db, s3 and cache extras.

inputs:
  python-version:
    description: Python version to install
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: "2.3.2"
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache virtualenv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('poetry.lock') }}

    - name: Install dependencies
      shell: bash
      run: poetry install --no-interaction --extras "db s3 cache"
