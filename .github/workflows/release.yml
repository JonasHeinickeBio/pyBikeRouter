name: release

# Publishes the container image and the easy-install download when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The image goes to ghcr.io/<owner>/pybikerouter (amd64 and arm64: a PC and a Raspberry Pi or an
# Apple-silicon Mac). The easy-install zip is attached to the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and attach the zip
  packages: write   # push the image

jobs:
  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Image name and tags (lower case, as registries require)
        id: names
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "image=ghcr.io/${owner}/pybikerouter"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
      - name: Emulation for the arm64 build
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}

  bundle:
    name: easy-install download
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the zip
        run: python3 scripts/make_easy_bundle.py dist
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pybikerouter-easy-*.zip --clobber
