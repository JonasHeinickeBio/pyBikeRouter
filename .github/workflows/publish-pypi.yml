name: publish-pypi

# Publishes the package to PyPI when a version tag is pushed (the same tag release.yml builds the
# container image from):
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# It uses PyPI "trusted publishing": no token is stored anywhere. It only works after the PyPI
# project has been told to trust this workflow (PyPI > Publishing > add a publisher: owner
# JonasHeinickeBio, repository pyBikeRouter, workflow publish-pypi.yml, environment pypi); until then
# the publish job fails and nothing is released. The MCP Registry entry (server.json) is published
# by hand afterwards, see docs/mcp.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag, pyproject.toml, __version__ and server.json agree
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # the OIDC token PyPI exchanges for a short-lived upload credential
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
