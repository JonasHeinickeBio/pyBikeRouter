name: Dependency review

on:
  pull_request:
    paths:
      - pyproject.toml
      - poetry.lock
      - docker/Dockerfile
      - .github/workflows/**
      - .github/actions/**

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
